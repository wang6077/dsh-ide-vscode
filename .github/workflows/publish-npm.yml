name: Publish to npm

# 打一个 v* tag 就发到 npm，全程不需要任何 token：GitHub Actions 通过 OIDC 向 npm
# 证明「我是这个仓库的这个 workflow」（Trusted Publishing），并附上 provenance
# （可验证的构建来源）。相比在本机用 access token 发布，好处是：token 不再落在任何
# 机器上，也没有 npm 新的「暂存区 + 人工 Approve」那一步。
#
# ⚠️ 一次性配置（必须先在 npm 上做，否则这个 job 会以 401 失败）：
#   1. 打开 https://www.npmjs.com/package/dsh-ide-vscode/settings
#   2. Trusted Publisher → GitHub Actions，填：
#        Organization or user : wang6077
#        Repository            : dsh-ide-vscode
#        Workflow filename     : publish-npm.yml
#        Environment           : 留空
#   3. 保存。npm 没有 PyPI 那种「待发布者」，所以包必须先存在（0.1.0 已经发过了）。
#
# 日常发版：改 package.json 的 version → 提交 → git tag vX.Y.Z && git push --tags
# 手动触发（Actions → Publish to npm → Run workflow）只做预检，不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Trusted Publishing 与 provenance 必需
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 要求 npm >= 11.5.1，runner 自带的 npm 不一定够新。
      # 固定版本而不是 npm@latest：latest 曾短暂发布过缺 sigstore 模块的构建，
      # 会让 npm publish --provenance 直接失败。
      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: npm install -g npm@11.5.1

      - name: tag 与 package.json 版本必须一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=v$tag / package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 里的 $pkg 不一致：先改版本、提交，再打 tag"
            exit 1
          fi

      # 这套测试只依赖 Node 内建模块（jsdom 那两套在 CI 里没有依赖，所以不跑）。
      - name: 冒烟测试
        run: node test/host-smoke.mjs

      - name: 这个版本是否已经发过
        id: exists
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "dsh-ide-vscode@$pkg" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "npm 上已经有 $pkg，跳过发布"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包预检（看会带上哪些文件）
        run: npm pack --dry-run

      - name: 发布（Trusted Publishing + provenance）
        if: steps.exists.outputs.publish == 'true' && github.event_name == 'push'
        run: npm publish --provenance --access public
